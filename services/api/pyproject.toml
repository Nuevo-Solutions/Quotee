[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inbox-to-quote-api"
version = "0.1.0"
description = "FastAPI backend for AI Inbox-to-Quote"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "openai>=2.11,<3",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tiktoken>=0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
